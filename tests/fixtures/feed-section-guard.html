        The home timeline has ALSO been observed wrapped in a section[aria-labelledby]

        <h1 id="accessible-list-0" class="visuallyhidden">Timeline</h1>

                <time datetime="2025-09-30T14:00:00.000Z" class="css-1rynq56">20h</time>
              </a>

              <span class="css-1jxf68">First synthetic timeline post — later posts in this timeline must not treat it as a parent.</span>
